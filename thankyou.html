<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pen Lab - thank you</title>
<script>
  window.dataLayer = window.dataLayer || [];

  // Drill 4 switch.
  // false = every load of this page sends the purchase again (the common bug).
  // true  = each order is sent only once (the fix a developer would make).
  var SEND_ONCE = false;

  var q = new URLSearchParams(location.search);
  var order = q.get('order');
  var value = parseFloat(q.get('value') || '0');
  var currency = q.get('currency') || 'USD';

  var sent = JSON.parse(localStorage.getItem('sent_orders') || '[]');
  var alreadySent = sent.indexOf(order) !== -1;

  if (order && !(SEND_ONCE && alreadySent)) {
    window.dataLayer.push({ ecommerce: null });
    window.dataLayer.push({
      event: 'purchase',
      ecommerce: {
        transaction_id: order,
        value: value,
        currency: currency,
        items: [{
          item_id: 'LAMP-OAK-01',
          item_name: 'Oak floor lamp',
          price: value,
          quantity: 1
        }]
      }
    });
    if (!alreadySent) {
      sent.push(order);
      localStorage.setItem('sent_orders', JSON.stringify(sent));
    }
  }
</script>

</head>
<body>
<h1>Thank you</h1>
<p>Order <strong id="o"></strong>, total <span id="v"></span></p>
<p><a href="index.html">Back to the store</a></p>
<script>
  document.getElementById('o').textContent = order || '(none)';
  document.getElementById('v').textContent = value.toFixed(2) + ' ' + currency;
</script>
