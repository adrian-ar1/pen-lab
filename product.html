<h1>Oak floor lamp - 129.00 USD</h1>
<button id="buy">Buy now</button>
<script>
  // Each click creates the next order number: 1001, 1002, ... (kept in this browser)
  document.getElementById('buy').onclick = function () {
    var n = parseInt(localStorage.getItem('order_counter') || '1000', 10) + 1;
    localStorage.setItem('order_counter', String(n));
